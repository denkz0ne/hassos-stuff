name: Blueprint checks

on:
  pull_request:
    paths:
      - "blueprints/automation/animus/**"
      - "tests/**"
      - ".github/workflows/blueprint-checks.yml"
  push:
    branches:
      - main
    paths:
      - "blueprints/automation/animus/**"
      - "tests/**"
      - ".github/workflows/blueprint-checks.yml"

permissions:
  contents: read

jobs:
  state-monitor-blueprint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML Jinja2
      - name: Validate blueprint structure and event filter
        run: python -m unittest discover -s tests -v
