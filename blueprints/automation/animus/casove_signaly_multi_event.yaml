blueprint:
  name: "Časové signály - autonómny multi-event chime & notifier (BETA)"
  description: |
    Jedna autonómna blueprint automatizácia pre ľubovoľný počet časových udalostí.

    Každá udalosť môže mať vlastný čas, dni, inteligentnú podmienku, zvuk,
    hlasitosť, počet opakovaní, pauzu, AAS vizuálnu signalizáciu,
    notify entity a vlastné Home Assistant akcie.

    Nevyžaduje externé helpery ani pomocné skripty.

    BETA:
    - plánovanie má minútové rozlíšenie
    - vlastné HA akcie podporujú bežné action/service kroky, delay a scene
    - vnorené flow-control kroky (choose/repeat/parallel/if) vo vlastných akciách
      zatiaľ nie sú interpretované
  domain: automation
  author: denkz0ne
  homeassistant:
    min_version: 2026.9.0

  input:
    events_section:
      name: Časové udalosti
      icon: mdi:calendar-clock
      description: |
        Pridaj ľubovoľný počet udalostí. Každá položka je samostatný časový signál.
        Prázdne výstupy sa jednoducho preskočia.
      input:
        events:
          name: Udalosti
          description: Pridaj, premenuj a nastav si toľko časov, koľko potrebuješ.
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              description_field: time
              fields:
                name:
                  label: Názov
                  required: true
                  selector:
                    text: {}

                time:
                  label: Čas
                  required: true
                  selector:
                    time: {}

                state:
                  label: Stav udalosti
                  selector:
                    select:
                      mode: list
                      options:
                        - label: Aktívna
                          value: active
                        - label: Vypnutá
                          value: disabled

                day_mode:
                  label: Platnosť
                  required: true
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - label: Každý deň
                          value: all
                        - label: Pracovné dni (Po-Pi)
                          value: workday
                        - label: Víkend (So-Ne)
                          value: weekend
                        - label: Vlastné dni
                          value: custom

                weekdays:
                  label: Vlastné dni
                  selector:
                    select:
                      multiple: true
                      mode: dropdown
                      options:
                        - label: Pondelok
                          value: mon
                        - label: Utorok
                          value: tue
                        - label: Streda
                          value: wed
                        - label: Štvrtok
                          value: thu
                        - label: Piatok
                          value: fri
                        - label: Sobota
                          value: sat
                        - label: Nedeľa
                          value: sun

                condition_rule:
                  label: Voliteľná podmienka
                  selector:
                    choose:
                      choices:
                        Boolean:
                          selector:
                            object:
                              fields:
                                entity:
                                  label: Entita
                                  required: true
                                  selector:
                                    entity:
                                      filter:
                                        - domain: binary_sensor
                                        - domain: input_boolean
                                        - domain: switch
                                        - domain: light
                                value:
                                  label: Musí byť
                                  required: true
                                  selector:
                                    boolean: {}

                        Číslo:
                          selector:
                            object:
                              fields:
                                entity:
                                  label: Číselná entita
                                  required: true
                                  selector:
                                    entity:
                                      filter:
                                        - domain: sensor
                                        - domain: number
                                        - domain: input_number
                                        - domain: counter
                                operator:
                                  label: Porovnanie
                                  required: true
                                  selector:
                                    select:
                                      mode: dropdown
                                      options:
                                        - label: Menšie ako
                                          value: lt
                                        - label: Menšie alebo rovné
                                          value: lte
                                        - label: Rovné
                                          value: eq
                                        - label: Nerovné
                                          value: neq
                                        - label: Väčšie alebo rovné
                                          value: gte
                                        - label: Väčšie ako
                                          value: gt
                                value:
                                  label: Hodnota
                                  required: true
                                  selector:
                                    text:
                                      type: number

                        "Text / stav":
                          selector:
                            object:
                              fields:
                                entity:
                                  label: Entita
                                  required: true
                                  selector:
                                    entity: {}
                                operator:
                                  label: Porovnanie
                                  required: true
                                  selector:
                                    select:
                                      mode: dropdown
                                      options:
                                        - label: Rovné
                                          value: eq
                                        - label: Nerovné
                                          value: neq
                                        - label: Obsahuje
                                          value: contains
                                        - label: Neobsahuje
                                          value: not_contains
                                        - label: Začína na
                                          value: starts
                                        - label: Končí na
                                          value: ends
                                value:
                                  label: Text / stav
                                  required: true
                                  selector:
                                    text: {}

                sound:
                  label: Zvuk
                  selector:
                    media:
                      accept:
                        - audio/*

                media_players:
                  label: Kde prehrať zvuk
                  selector:
                    entity:
                      multiple: true
                      reorder: true
                      filter:
                        - domain: media_player

                volume_percent:
                  label: Hlasitosť zvuku
                  selector:
                    number:
                      min: 0
                      max: 100
                      step: 1
                      unit_of_measurement: "%"
                      mode: slider

                repeat_count:
                  label: Počet prehratí
                  selector:
                    number:
                      min: 0
                      max: 20
                      step: 1
                      mode: box

                pause_between:
                  label: Pauza medzi prehratiami
                  selector:
                    duration:
                      enable_day: false
                      enable_second: true
                      enable_millisecond: false

                notify_target:
                  label: Kam poslať notifikáciu
                  selector:
                    target:
                      entity:
                        - domain: notify

                notify_title:
                  label: Nadpis notifikácie
                  selector:
                    text: {}

                notify_message:
                  label: Text notifikácie
                  selector:
                    text:
                      multiline: true

                aas_event:
                  label: AAS vizuálna notifikácia
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - label: Žiadna
                          value: none
                        - label: Ping
                          value: ping
                        - label: Pohyb
                          value: pohyb
                        - label: Zvonček
                          value: zvoncek
                        - label: Správa
                          value: sprava
                        - label: Upozornenie
                          value: upozornenie
                        - label: Chyba
                          value: chyba
                        - label: Úspech
                          value: uspech
                        - label: Informácia
                          value: informacia
                        - label: Pripomienka
                          value: pripomienka

                aas_scope:
                  label: Kde prehrať AAS
                  selector:
                    select:
                      mode: list
                      options:
                        - label: Na všetkých AAS zariadeniach
                          value: all
                        - label: Iba na vybraných ESP
                          value: selected

                aas_nodes:
                  label: Vybrané AAS ESP
                  selector:
                    select:
                      multiple: true
                      mode: dropdown
                      options:
                        - label: Notifikačná žiarovka - esp-87-bulb
                          value: esp-87-bulb
                        - label: IKEA Vindriktning - esp-85-vindriktning
                          value: esp-85-vindriktning
                        - label: Aura - esphome-117-aura
                          value: esphome-117-aura

                custom_actions:
                  label: Vlastné HA akcie
                  selector:
                    action: {}

    calendar_section:
      name: Kalendár bez helperov
      icon: mdi:calendar-edit
      collapsed: true
      description: |
        Blueprint si pracovné dni počíta sám ako Po-Pi.
        Tu môžeš pridať výnimky, napr. sviatok uprostred týždňa alebo pracovnú sobotu.
      input:
        date_overrides:
          name: Výnimky dátumov
          default: []
          selector:
            object:
              multiple: true
              label_field: date
              description_field: mode
              fields:
                date:
                  label: Dátum
                  required: true
                  selector:
                    date: {}
                mode:
                  label: Správať sa ako
                  required: true
                  selector:
                    select:
                      mode: list
                      options:
                        - label: Pracovný deň
                          value: workday
                        - label: Víkend / voľno
                          value: weekend

    defaults_section:
      name: Predvolené hodnoty
      icon: mdi:tune-variant
      collapsed: true
      description: |
        Event môže tieto hodnoty prepísať. Keď ich necháš pri evente prázdne,
        použijú sa tieto globálne nastavenia.
      input:
        default_media_players:
          name: Predvolené media playery
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: media_player

        default_sound:
          name: Predvolený zvuk
          default: {}
          selector:
            media:
              accept:
                - audio/*

        default_volume_percent:
          name: Predvolená hlasitosť zvuku
          default: 60
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        default_repeat_count:
          name: Predvolený počet prehratí
          default: 1
          selector:
            number:
              min: 0
              max: 20
              step: 1
              mode: box

        default_pause_between:
          name: Predvolená pauza medzi prehratiami
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: false
              enable_second: true
              enable_millisecond: false

        default_notify_target:
          name: Predvolený cieľ notifikácie
          default: {}
          selector:
            target:
              entity:
                - domain: notify

        default_notify_title:
          name: Predvolený nadpis
          default: ""
          selector:
            text: {}

variables:
  schedule_events: !input events
  date_overrides_config: !input date_overrides

  global_media_players: !input default_media_players
  global_sound: !input default_sound
  global_volume_percent: !input default_volume_percent
  global_repeat_count: !input default_repeat_count
  global_pause_between: !input default_pause_between

  global_notify_target: !input default_notify_target
  global_notify_title: !input default_notify_title

  current_hm: "{{ now().strftime('%H:%M') }}"
  current_date: "{{ now().strftime('%Y-%m-%d') }}"
  current_weekday: "{{ ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] }}"

  today_mode: >-
    {% set ns = namespace(mode='workday' if now().weekday() < 5 else 'weekend') %}
    {% for item in date_overrides_config %}
      {% if (item.get('date', '') | string) == current_date %}
        {% set ns.mode = item.get('mode', ns.mode) %}
      {% endif %}
    {% endfor %}
    {{ ns.mode }}

  matched_events: >-
    {% set ns = namespace(items=[]) %}
    {% for item in schedule_events %}
      {% set item_time = (item.get('time', '') | string) %}
      {% set item_state = item.get('state', 'active') or 'active' %}
      {% if item_time[:5] == current_hm and item_state != 'disabled' %}
        {% set ns.items = ns.items + [item] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

triggers:
  - trigger: time_pattern
    minutes: "*"

conditions:
  - condition: template
    value_template: "{{ matched_events | count > 0 }}"

actions:
  - alias: Spracuj udalosti naplánované na túto minútu
    repeat:
      for_each: "{{ matched_events }}"
      sequence:
        - variables:
            event_name: "{{ repeat.item.get('name', 'Časový signál') }}"
            event_time: "{{ (repeat.item.get('time', '') | string)[:5] }}"
            event_day_mode: "{{ repeat.item.get('day_mode', 'all') }}"
            event_weekdays: "{{ repeat.item.get('weekdays', []) or [] }}"
            event_condition_rule: "{{ repeat.item.get('condition_rule', {}) or {} }}"

            event_sound: >-
              {{ repeat.item.get('sound') if repeat.item.get('sound') else global_sound }}
            event_media_players: >-
              {{ repeat.item.get('media_players', []) or global_media_players }}
            event_volume_percent: >-
              {{ repeat.item.get('volume_percent', global_volume_percent) | float(60) }}
            event_repeat_count: >-
              {{ repeat.item.get('repeat_count', global_repeat_count) | int(1) }}
            event_pause_between: >-
              {{ repeat.item.get('pause_between') if repeat.item.get('pause_between') else global_pause_between }}

            event_notify_target: >-
              {{ repeat.item.get('notify_target') if repeat.item.get('notify_target') else global_notify_target }}
            event_notify_title: >-
              {{ repeat.item.get('notify_title') or global_notify_title }}
            event_notify_message: >-
              {{ repeat.item.get('notify_message') or repeat.item.get('name', 'Časový signál') }}

            event_aas_event: "{{ repeat.item.get('aas_event', 'none') or 'none' }}"
            event_aas_scope: "{{ repeat.item.get('aas_scope', 'all') or 'all' }}"
            event_aas_nodes: "{{ repeat.item.get('aas_nodes', []) or [] }}"

            event_custom_actions: "{{ repeat.item.get('custom_actions', []) or [] }}"

        - variables:
            event_pause_seconds: >-
              {{
                (event_pause_between.get('hours', 0) | int(0)) * 3600
                + (event_pause_between.get('minutes', 0) | int(0)) * 60
                + (event_pause_between.get('seconds', 0) | int(0))
              }}

            day_allowed: >-
              {% set mode = event_day_mode %}
              {% if mode == 'all' %}
                {{ true }}
              {% elif mode == 'workday' %}
                {{ today_mode == 'workday' }}
              {% elif mode == 'weekend' %}
                {{ today_mode == 'weekend' }}
              {% elif mode == 'custom' %}
                {{ current_weekday in event_weekdays }}
              {% else %}
                {{ true }}
              {% endif %}

            condition_allowed: >-
              {% if not event_condition_rule %}
                {{ true }}
              {% else %}
                {% set choice = event_condition_rule.get('active_choice', '') %}
                {% set cfg = event_condition_rule.get(choice, {}) or {} %}
                {% set entity_id = cfg.get('entity', '') %}

                {% if not entity_id %}
                  {{ false }}

                {% elif choice == 'Boolean' %}
                  {% set wanted = cfg.get('value', true) | bool %}
                  {{ is_state(entity_id, 'on') if wanted else is_state(entity_id, 'off') }}

                {% elif choice == 'Číslo' %}
                  {% set raw_current = states(entity_id) %}
                  {% set current = raw_current | float(none) %}
                  {% set wanted = cfg.get('value') | float(none) %}
                  {% set op = cfg.get('operator', 'eq') %}
                  {% if current is none or wanted is none or raw_current in ['unknown', 'unavailable'] %}
                    {{ false }}
                  {% elif op == 'lt' %}
                    {{ current < wanted }}
                  {% elif op == 'lte' %}
                    {{ current <= wanted }}
                  {% elif op == 'eq' %}
                    {{ current == wanted }}
                  {% elif op == 'neq' %}
                    {{ current != wanted }}
                  {% elif op == 'gte' %}
                    {{ current >= wanted }}
                  {% elif op == 'gt' %}
                    {{ current > wanted }}
                  {% else %}
                    {{ false }}
                  {% endif %}

                {% elif choice == 'Text / stav' %}
                  {% set current = states(entity_id) %}
                  {% set wanted = cfg.get('value', '') | string %}
                  {% set op = cfg.get('operator', 'eq') %}
                  {% if current in ['unknown', 'unavailable'] %}
                    {{ false }}
                  {% elif op == 'eq' %}
                    {{ current == wanted }}
                  {% elif op == 'neq' %}
                    {{ current != wanted }}
                  {% elif op == 'contains' %}
                    {{ wanted in current }}
                  {% elif op == 'not_contains' %}
                    {{ wanted not in current }}
                  {% elif op == 'starts' %}
                    {{ current.startswith(wanted) }}
                  {% elif op == 'ends' %}
                    {{ current.endswith(wanted) }}
                  {% else %}
                    {{ false }}
                  {% endif %}

                {% else %}
                  {{ false }}
                {% endif %}
              {% endif %}

            event_allowed: "{{ day_allowed | bool and condition_allowed | bool }}"

        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ event_allowed }}"
              sequence:
                - alias: Zvuk, AAS, notifikácie a vlastné akcie paralelne
                  parallel:
                    - sequence:
                        - alias: Audio
                          choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{
                                      event_repeat_count > 0
                                      and (event_media_players | count) > 0
                                      and event_sound is mapping
                                      and event_sound.get('media_content_id', '') != ''
                                    }}
                              sequence:
                                - variables:
                                    original_volumes: >-
                                      {% set ns = namespace(items=[]) %}
                                      {% for player in event_media_players %}
                                        {% set ns.items = ns.items + [{
                                          'entity_id': player,
                                          'volume': state_attr(player, 'volume_level')
                                        }] %}
                                      {% endfor %}
                                      {{ ns.items }}

                                - alias: Nastav dočasnú hlasitosť
                                  continue_on_error: true
                                  action: media_player.volume_set
                                  target:
                                    entity_id: "{{ event_media_players }}"
                                  data:
                                    volume_level: "{{ event_volume_percent / 100 }}"

                                - repeat:
                                    count: "{{ event_repeat_count }}"
                                    sequence:
                                      - continue_on_error: true
                                        action: media_player.play_media
                                        target:
                                          entity_id: "{{ event_media_players }}"
                                        data:
                                          media_content_id: "{{ event_sound.get('media_content_id') }}"
                                          media_content_type: "{{ event_sound.get('media_content_type', 'music') }}"

                                      - choose:
                                          - conditions:
                                              - condition: template
                                                value_template: >-
                                                  {{
                                                    repeat.index < event_repeat_count
                                                    and event_pause_seconds > 0
                                                  }}
                                            sequence:
                                              - delay:
                                                  seconds: "{{ event_pause_seconds }}"

                                - alias: Daj prehrávaču chvíľu aktualizovať stav
                                  delay:
                                    milliseconds: 500

                                - alias: Počkaj na dohratie posledného zvuku
                                  wait_template: >-
                                    {% set ns = namespace(done=true) %}
                                    {% for player in event_media_players %}
                                      {% if states(player) in ['playing', 'buffering'] %}
                                        {% set ns.done = false %}
                                      {% endif %}
                                    {% endfor %}
                                    {{ ns.done }}
                                  timeout:
                                    seconds: 60
                                  continue_on_timeout: true

                                - alias: Obnov pôvodnú hlasitosť každého prehrávača
                                  repeat:
                                    for_each: "{{ original_volumes }}"
                                    sequence:
                                      - choose:
                                          - conditions:
                                              - condition: template
                                                value_template: "{{ repeat.item.volume is number }}"
                                            sequence:
                                              - continue_on_error: true
                                                action: media_player.volume_set
                                                target:
                                                  entity_id: "{{ repeat.item.entity_id }}"
                                                data:
                                                  volume_level: "{{ repeat.item.volume }}"

                    - sequence:
                        - alias: AAS vizuálna notifikácia
                          choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ event_aas_event != 'none' and event_aas_scope == 'all' }}
                              sequence:
                                - continue_on_error: true
                                  action: mqtt.publish
                                  data:
                                    topic: aas/udalost
                                    payload: "{{ event_aas_event }}"
                                    qos: 1
                                    retain: false

                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{
                                      event_aas_event != 'none'
                                      and event_aas_scope == 'selected'
                                      and (event_aas_nodes | count) > 0
                                    }}
                              sequence:
                                - repeat:
                                    for_each: "{{ event_aas_nodes }}"
                                    sequence:
                                      - continue_on_error: true
                                        action: mqtt.publish
                                        data:
                                          topic: "aas/udalost/{{ repeat.item }}"
                                          payload: "{{ event_aas_event }}"
                                          qos: 1
                                          retain: false

                    - sequence:
                        - alias: Notify entity
                          choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ (event_notify_target | count) > 0 }}"
                              sequence:
                                - continue_on_error: true
                                  action: notify.send_message
                                  target: "{{ event_notify_target }}"
                                  data:
                                    title: "{{ event_notify_title }}"
                                    message: "{{ event_notify_message }}"

                    - sequence:
                        - alias: Vlastné HA akcie z action editora
                          repeat:
                            for_each: "{{ event_custom_actions }}"
                            sequence:
                              - variables:
                                  custom_step: "{{ repeat.item }}"

                              - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ custom_step.action is defined }}"
                                    sequence:
                                      - choose:
                                          - conditions:
                                              - condition: template
                                                value_template: >-
                                                  {{
                                                    custom_step.target is defined
                                                    and custom_step.data is defined
                                                  }}
                                            sequence:
                                              - continue_on_error: true
                                                action: "{{ custom_step.action }}"
                                                target: "{{ custom_step.target }}"
                                                data: "{{ custom_step.data }}"

                                          - conditions:
                                              - condition: template
                                                value_template: "{{ custom_step.target is defined }}"
                                            sequence:
                                              - continue_on_error: true
                                                action: "{{ custom_step.action }}"
                                                target: "{{ custom_step.target }}"

                                          - conditions:
                                              - condition: template
                                                value_template: "{{ custom_step.data is defined }}"
                                            sequence:
                                              - continue_on_error: true
                                                action: "{{ custom_step.action }}"
                                                data: "{{ custom_step.data }}"

                                        default:
                                          - continue_on_error: true
                                            action: "{{ custom_step.action }}"

                                  - conditions:
                                      - condition: template
                                        value_template: "{{ custom_step.delay is defined }}"
                                    sequence:
                                      - delay: "{{ custom_step.delay }}"

                                  - conditions:
                                      - condition: template
                                        value_template: "{{ custom_step.scene is defined }}"
                                    sequence:
                                      - continue_on_error: true
                                        action: scene.turn_on
                                        target:
                                          entity_id: "{{ custom_step.scene }}"

mode: parallel
max: 20
max_exceeded: silent
