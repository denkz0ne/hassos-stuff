blueprint:
  name: "Časové signály - autonómny multi-event chime & notifier (BETA)"
  description: |
    Jedna autonómna blueprint automatizácia pre ľubovoľný počet časových udalostí.

    Každá udalosť môže mať vlastný čas, dni, zvuk, počet opakovaní, pauzu,
    svetelnú signalizáciu, notify entity a vlastné Home Assistant akcie.
    Nevyžaduje žiadne externé skripty ani helpery.

    BETA:
    - plánovanie má minútové rozlíšenie
    - vlastné HA akcie podporujú bežné action/service kroky, delay a scene
    - vnorené flow-control kroky (choose/repeat/parallel/if) vo vlastných akciách
      zatiaľ nie sú interpretované
  domain: automation
  author: denkz0ne
  homeassistant:
    min_version: 2026.9.0

  input:
    events_section:
      name: Časové udalosti
      icon: mdi:calendar-clock
      description: |
        Pridaj ľubovoľný počet udalostí. Každá položka je samostatný časový signál.
        Prázdne výstupy sa jednoducho preskočia.
      input:
        events:
          name: Udalosti
          description: Pridaj, premenuj a nastav si toľko časov, koľko potrebuješ.
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              description_field: time
              fields:
                name:
                  label: Názov
                  required: true
                  selector:
                    text: {}

                time:
                  label: Čas
                  required: true
                  selector:
                    time: {}

                state:
                  label: Stav udalosti
                  selector:
                    select:
                      mode: list
                      options:
                        - label: Aktívna
                          value: active
                        - label: Vypnutá
                          value: disabled

                day_mode:
                  label: Platnosť
                  required: true
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - label: Každý deň
                          value: all
                        - label: Pracovné dni (Po-Pi)
                          value: workday
                        - label: Víkend (So-Ne)
                          value: weekend
                        - label: Vlastné dni
                          value: custom

                weekdays:
                  label: Vlastné dni
                  selector:
                    select:
                      multiple: true
                      mode: dropdown
                      options:
                        - label: Pondelok
                          value: mon
                        - label: Utorok
                          value: tue
                        - label: Streda
                          value: wed
                        - label: Štvrtok
                          value: thu
                        - label: Piatok
                          value: fri
                        - label: Sobota
                          value: sat
                        - label: Nedeľa
                          value: sun

                guard_entity:
                  label: Voliteľná podmienka - entita
                  selector:
                    entity: {}

                guard_state:
                  label: Voliteľná podmienka - požadovaný stav
                  selector:
                    text:
                      prefix: "stav = "

                sound:
                  label: Zvuk
                  selector:
                    media:
                      accept:
                        - audio/*

                media_players:
                  label: Media playery
                  selector:
                    entity:
                      multiple: true
                      reorder: true
                      filter:
                        - domain: media_player

                repeat_count:
                  label: Počet prehratí
                  selector:
                    number:
                      min: 0
                      max: 20
                      step: 1
                      mode: box

                pause_seconds:
                  label: Pauza medzi prehratiami
                  selector:
                    number:
                      min: 0
                      max: 120
                      step: 0.5
                      unit_of_measurement: s
                      mode: box

                notify_targets:
                  label: Notify entity ciele
                  selector:
                    entity:
                      multiple: true
                      reorder: true
                      filter:
                        - domain: notify

                notify_title:
                  label: Nadpis notifikácie
                  selector:
                    text: {}

                notify_message:
                  label: Text notifikácie
                  selector:
                    text:
                      multiline: true

                visual_lights:
                  label: Svetlá
                  selector:
                    entity:
                      multiple: true
                      reorder: true
                      filter:
                        - domain: light

                visual_style:
                  label: Svetelný signál
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - label: Žiadny
                          value: none
                        - label: Krátky flash
                          value: flash_short
                        - label: Dlhý flash
                          value: flash_long
                        - label: Zapnúť
                          value: turn_on
                        - label: Vypnúť
                          value: turn_off
                        - label: Prepnúť
                          value: toggle

                custom_actions:
                  label: Vlastné HA akcie
                  selector:
                    action: {}

    calendar_section:
      name: Kalendár bez helperov
      icon: mdi:calendar-edit
      collapsed: true
      description: |
        Blueprint si pracovné dni počíta sám ako Po-Pi.
        Tu môžeš pridať výnimky, napr. sviatok uprostred týždňa alebo pracovnú sobotu.
      input:
        date_overrides:
          name: Výnimky dátumov
          default: []
          selector:
            object:
              multiple: true
              label_field: date
              description_field: mode
              fields:
                date:
                  label: Dátum
                  required: true
                  selector:
                    date: {}
                mode:
                  label: Správať sa ako
                  required: true
                  selector:
                    select:
                      mode: list
                      options:
                        - label: Pracovný deň
                          value: workday
                        - label: Víkend / voľno
                          value: weekend

    defaults_section:
      name: Predvolené hodnoty
      icon: mdi:tune-variant
      collapsed: true
      description: |
        Event môže tieto hodnoty prepísať. Keď ich necháš pri evente prázdne,
        použijú sa tieto globálne nastavenia.
      input:
        default_media_players:
          name: Predvolené media playery
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: media_player

        default_sound:
          name: Predvolený zvuk
          default: {}
          selector:
            media:
              accept:
                - audio/*

        default_repeat_count:
          name: Predvolený počet prehratí
          default: 1
          selector:
            number:
              min: 0
              max: 20
              step: 1
              mode: box

        default_pause_seconds:
          name: Predvolená pauza
          default: 0
          selector:
            number:
              min: 0
              max: 120
              step: 0.5
              unit_of_measurement: s
              mode: box

        default_notify_targets:
          name: Predvolené notify entity
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: notify

        default_notify_title:
          name: Predvolený nadpis
          default: ""
          selector:
            text: {}

        default_visual_lights:
          name: Predvolené svetlá
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: light

        default_visual_style:
          name: Predvolený svetelný signál
          default: none
          selector:
            select:
              mode: dropdown
              options:
                - label: Žiadny
                  value: none
                - label: Krátky flash
                  value: flash_short
                - label: Dlhý flash
                  value: flash_long
                - label: Zapnúť
                  value: turn_on
                - label: Vypnúť
                  value: turn_off
                - label: Prepnúť
                  value: toggle

variables:
  schedule_events: !input events
  date_overrides_config: !input date_overrides

  global_media_players: !input default_media_players
  global_sound: !input default_sound
  global_repeat_count: !input default_repeat_count
  global_pause_seconds: !input default_pause_seconds

  global_notify_targets: !input default_notify_targets
  global_notify_title: !input default_notify_title

  global_visual_lights: !input default_visual_lights
  global_visual_style: !input default_visual_style

  current_hm: "{{ now().strftime('%H:%M') }}"
  current_date: "{{ now().strftime('%Y-%m-%d') }}"
  current_weekday: "{{ ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] }}"

  today_mode: >-
    {% set ns = namespace(mode='workday' if now().weekday() < 5 else 'weekend') %}
    {% for item in date_overrides_config %}
      {% if (item.get('date', '') | string) == current_date %}
        {% set ns.mode = item.get('mode', ns.mode) %}
      {% endif %}
    {% endfor %}
    {{ ns.mode }}

  matched_events: >-
    {% set ns = namespace(items=[]) %}
    {% for item in schedule_events %}
      {% set item_time = (item.get('time', '') | string) %}
      {% set item_state = item.get('state', 'active') or 'active' %}
      {% if item_time[:5] == current_hm and item_state != 'disabled' %}
        {% set ns.items = ns.items + [item] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

triggers:
  - trigger: time_pattern
    minutes: "*"

conditions:
  - condition: template
    value_template: "{{ matched_events | count > 0 }}"

actions:
  - alias: Spracuj udalosti naplánované na túto minútu
    repeat:
      for_each: "{{ matched_events }}"
      sequence:
        - variables:
            event_name: "{{ repeat.item.get('name', 'Časový signál') }}"
            event_time: "{{ (repeat.item.get('time', '') | string)[:5] }}"
            event_day_mode: "{{ repeat.item.get('day_mode', 'all') }}"
            event_weekdays: "{{ repeat.item.get('weekdays', []) or [] }}"
            event_guard_entity: "{{ repeat.item.get('guard_entity', '') or '' }}"
            event_guard_state: "{{ repeat.item.get('guard_state', '') or '' }}"

            event_sound: >-
              {{ repeat.item.get('sound') if repeat.item.get('sound') else global_sound }}
            event_media_players: >-
              {{ repeat.item.get('media_players', []) or global_media_players }}
            event_repeat_count: >-
              {{ repeat.item.get('repeat_count', global_repeat_count) | int(1) }}
            event_pause_seconds: >-
              {{ repeat.item.get('pause_seconds', global_pause_seconds) | float(0) }}

            event_notify_targets: >-
              {{ repeat.item.get('notify_targets', []) or global_notify_targets }}
            event_notify_title: >-
              {{ repeat.item.get('notify_title') or global_notify_title }}
            event_notify_message: >-
              {{ repeat.item.get('notify_message') or repeat.item.get('name', 'Časový signál') }}

            event_visual_lights: >-
              {{ repeat.item.get('visual_lights', []) or global_visual_lights }}
            event_visual_style: >-
              {{ repeat.item.get('visual_style') or global_visual_style }}

            event_custom_actions: "{{ repeat.item.get('custom_actions', []) or [] }}"

        - variables:
            event_allowed: >-
              {% set mode = event_day_mode %}
              {% if mode == 'all' %}
                {% set day_ok = true %}
              {% elif mode == 'workday' %}
                {% set day_ok = today_mode == 'workday' %}
              {% elif mode == 'weekend' %}
                {% set day_ok = today_mode == 'weekend' %}
              {% elif mode == 'custom' %}
                {% set day_ok = current_weekday in event_weekdays %}
              {% else %}
                {% set day_ok = true %}
              {% endif %}

              {% if not event_guard_entity %}
                {% set guard_ok = true %}
              {% elif not event_guard_state %}
                {% set guard_ok = states(event_guard_entity) not in ['unknown', 'unavailable'] %}
              {% else %}
                {% set guard_ok = is_state(event_guard_entity, event_guard_state) %}
              {% endif %}
              {{ day_ok and guard_ok }}

        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ event_allowed }}"
              sequence:
                - alias: Zvuk, svetlo, notifikácie a vlastné akcie paralelne
                  parallel:
                    - sequence:
                        - alias: Audio
                          choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{
                                      event_repeat_count > 0
                                      and (event_media_players | count) > 0
                                      and event_sound is mapping
                                      and event_sound.get('media_content_id', '') != ''
                                    }}
                              sequence:
                                - repeat:
                                    count: "{{ event_repeat_count }}"
                                    sequence:
                                      - continue_on_error: true
                                        action: media_player.play_media
                                        target:
                                          entity_id: "{{ event_media_players }}"
                                        data:
                                          media_content_id: "{{ event_sound.get('media_content_id') }}"
                                          media_content_type: "{{ event_sound.get('media_content_type', 'music') }}"

                                      - choose:
                                          - conditions:
                                              - condition: template
                                                value_template: >-
                                                  {{
                                                    repeat.index < event_repeat_count
                                                    and event_pause_seconds > 0
                                                  }}
                                            sequence:
                                              - delay:
                                                  seconds: "{{ event_pause_seconds }}"

                    - sequence:
                        - alias: Svetelný signál
                          choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{
                                      (event_visual_lights | count) > 0
                                      and event_visual_style in ['flash_short', 'flash_long']
                                    }}
                              sequence:
                                - continue_on_error: true
                                  action: light.turn_on
                                  target:
                                    entity_id: "{{ event_visual_lights }}"
                                  data:
                                    flash: "{{ 'short' if event_visual_style == 'flash_short' else 'long' }}"

                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ (event_visual_lights | count) > 0 and event_visual_style == 'turn_on' }}
                              sequence:
                                - continue_on_error: true
                                  action: light.turn_on
                                  target:
                                    entity_id: "{{ event_visual_lights }}"

                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ (event_visual_lights | count) > 0 and event_visual_style == 'turn_off' }}
                              sequence:
                                - continue_on_error: true
                                  action: light.turn_off
                                  target:
                                    entity_id: "{{ event_visual_lights }}"

                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ (event_visual_lights | count) > 0 and event_visual_style == 'toggle' }}
                              sequence:
                                - continue_on_error: true
                                  action: light.toggle
                                  target:
                                    entity_id: "{{ event_visual_lights }}"

                    - sequence:
                        - alias: Notify entity
                          choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ (event_notify_targets | count) > 0 }}"
                              sequence:
                                - continue_on_error: true
                                  action: notify.send_message
                                  target:
                                    entity_id: "{{ event_notify_targets }}"
                                  data:
                                    title: "{{ event_notify_title }}"
                                    message: "{{ event_notify_message }}"

                    - sequence:
                        - alias: Vlastné HA akcie z action editora
                          repeat:
                            for_each: "{{ event_custom_actions }}"
                            sequence:
                              - variables:
                                  custom_step: "{{ repeat.item }}"

                              - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ custom_step.action is defined }}"
                                    sequence:
                                      - choose:
                                          - conditions:
                                              - condition: template
                                                value_template: >-
                                                  {{
                                                    custom_step.target is defined
                                                    and custom_step.data is defined
                                                  }}
                                            sequence:
                                              - continue_on_error: true
                                                action: "{{ custom_step.action }}"
                                                target: "{{ custom_step.target }}"
                                                data: "{{ custom_step.data }}"

                                          - conditions:
                                              - condition: template
                                                value_template: "{{ custom_step.target is defined }}"
                                            sequence:
                                              - continue_on_error: true
                                                action: "{{ custom_step.action }}"
                                                target: "{{ custom_step.target }}"

                                          - conditions:
                                              - condition: template
                                                value_template: "{{ custom_step.data is defined }}"
                                            sequence:
                                              - continue_on_error: true
                                                action: "{{ custom_step.action }}"
                                                data: "{{ custom_step.data }}"

                                        default:
                                          - continue_on_error: true
                                            action: "{{ custom_step.action }}"

                                  - conditions:
                                      - condition: template
                                        value_template: "{{ custom_step.delay is defined }}"
                                    sequence:
                                      - delay: "{{ custom_step.delay }}"

                                  - conditions:
                                      - condition: template
                                        value_template: "{{ custom_step.scene is defined }}"
                                    sequence:
                                      - continue_on_error: true
                                        action: scene.turn_on
                                        target:
                                          entity_id: "{{ custom_step.scene }}"

mode: parallel
max: 20
max_exceeded: silent
