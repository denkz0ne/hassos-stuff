blueprint:
  name: "AAS - Univerzálny sledovač stavu"
  description: |
    **Version**: 2.1.0

    Jedna automatizácia môže sledovať ľubovoľný počet entít. Každý sledovač má
    vlastnú entitu, cieľový stav, odklad upozornenia, zvuk, interval a celkové
    trvanie upozorňovania. Podporované sú binary_sensor, switch, light a sensor
    vrátane stavov unavailable/unknown.

    AAS eventy sa posielajú na MQTT tému aas/udalost. Telegram aj ďalšie akcie
    sa nastavujú v spoločných action poliach; texty môžu používať premenné
    monitor_name_value a monitor_state_value. Každý sledovač sa spracúva
    nezávisle. Zmena entity ukončí iba jej vlastný cyklus.

    Ochranná podmienka pred akciami prepúšťa iba zmenu hlavného stavu sledovanej
    entity; ostatné HA state_changed udalosti a zmeny atribútov sa zahodia.
  domain: automation
  author: denkz0ne
  source_url: https://github.com/denkz0ne/hassos-stuff/blob/main/blueprints/automation/animus/dvere_okna_kontakt_alert.yaml
  homeassistant:
    min_version: 2024.6.0

  input:
    monitors_section:
      name: Sledovače
      icon: mdi:eye-check
      description: |
        Pridaj jeden záznam pre každé okno, dvere, senzor alebo vypínač.
        Vyber bežný stav zo zoznamu alebo zadaj vlastný stav senzora.
        Každý záznam beží samostatne.
      input:
        monitors:
          name: Sledované entity
          description: Pridaj ľubovoľný počet nezávislých sledovačov.
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              fields:
                enabled:
                  label: Aktívny
                  required: true
                  selector:
                    boolean: {}
                name:
                  label: Názov sledovača
                  required: true
                  selector:
                    text: {}
                entity:
                  label: Sledovaná entita
                  required: true
                  selector:
                    entity:
                      filter:
                        - domain: binary_sensor
                        - domain: switch
                        - domain: light
                        - domain: sensor
                target_state:
                  label: Stav, na ktorý upozorňovať
                  required: true
                  selector:
                    select:
                      mode: dropdown
                      custom_value: true
                      options:
                        - label: Zapnuté (on)
                          value: "on"
                        - label: Vypnuté (off)
                          value: "off"
                        - label: Otvorené (open)
                          value: "open"
                        - label: Zatvorené (closed)
                          value: "closed"
                        - label: Áno (true)
                          value: "true"
                        - label: Nie (false)
                          value: "false"
                        - label: Nedostupné (unavailable)
                          value: "unavailable"
                        - label: Neznáme (unknown)
                          value: "unknown"
                alert_after:
                  label: Začať upozorňovať po
                  required: true
                  selector:
                    duration:
                      enable_second: true
                repeat_interval:
                  label: Interval zvukového upozornenia
                  required: true
                  selector:
                    duration:
                      enable_second: true
                alert_duration:
                  label: Celkový čas upozorňovania
                  required: true
                  selector:
                    duration:
                      enable_second: true
                media_players:
                  label: Media playery
                  selector:
                    entity:
                      multiple: true
                      filter:
                        - domain: media_player
                entry_sound_enabled:
                  label: Prehrať zvuk pri vstupe do sledovaného stavu
                  default: true
                  selector:
                    boolean: {}
                entry_sound:
                  label: Zvuk pri vstupe do sledovaného stavu
                  default: {}
                  selector:
                    media:
                      accept:
                        - audio/*
                recovery_sound_enabled:
                  label: Prehrať zvuk po zmene zo sledovaného stavu
                  default: true
                  selector:
                    boolean: {}
                recovery_sound:
                  label: Prehrať zvuk po zmene zo sledovaného stavu
                  default: {}
                  selector:
                    media:
                      accept:
                        - audio/*
                alert_sound_enabled:
                  label: Opakovať zvuk počas upozorňovania
                  default: true
                  selector:
                    boolean: {}
                alert_sound:
                  label: Zvuk opakovaného upozornenia
                  default: {}
                  selector:
                    media:
                      accept:
                        - audio/*
                sound_volume:
                  label: Hlasitosť
                  default: 0.7
                  selector:
                    number:
                      min: 0
                      max: 1
                      step: 0.05
                      mode: slider
                aas_start_event:
                  label: AAS event pri začiatku upozorňovania
                  default: upozornenie
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - none
                        - ping
                        - pohyb
                        - zvoncek
                        - sprava
                        - upozornenie
                        - chyba
                        - uspech
                        - informacia
                        - pripomienka
                aas_cleared_event:
                  label: AAS event po zmene stavu
                  default: uspech
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - none
                        - ping
                        - pohyb
                        - zvoncek
                        - sprava
                        - upozornenie
                        - chyba
                        - uspech
                        - informacia
                        - pripomienka
                aas_timeout_event:
                  label: AAS event po vypršaní času
                  default: chyba
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - none
                        - ping
                        - pohyb
                        - zvoncek
                        - sprava
                        - upozornenie
                        - chyba
                        - uspech
                        - informacia
                        - pripomienka

    actions_section:
      name: Telegram a vlastné akcie
      icon: mdi:message-text
      description: |
        Akcie sú spoločné pre všetky sledovače. Vlož do každej časti natívne
        Home Assistant actions, napríklad notify.send_message. V správach môžeš
        použiť {{ monitor_name_value }} a {{ monitor_state_value }}.
      input:
        alert_started_actions:
          name: Akcie pri začiatku upozorňovania
          description: Spustia sa po odklade, len ak entita stále má cieľový stav.
          default: []
          selector:
            action: {}
        state_cleared_actions:
          name: Akcie keď sa sledovaný stav zmení
          description: Spustia sa, ak sa stav zmení pred uplynutím celkového času.
          default: []
          selector:
            action: {}
        alert_timeout_actions:
          name: Akcie po uplynutí celkového času
          description: Spustia sa, ak cieľový stav pretrvá celý čas upozorňovania.
          default: []
          selector:
            action: {}

trigger:
  - platform: event
    event_type: state_changed
    id: entity_state_changed
  - platform: homeassistant
    event: start
    id: homeassistant_start

trigger_variables:
  monitor_rules_for_filter: !input monitors

condition:
  - condition: template
    value_template: >-
      {% set ns = namespace(entities=[]) %}
      {% for monitor in monitor_rules_for_filter %}
        {% if monitor.get('enabled', true) %}
          {% set ns.entities = ns.entities + [monitor.get('entity', '')] %}
        {% endif %}
      {% endfor %}
      {% if trigger.id == 'homeassistant_start' %}
        {{ ns.entities | count > 0 }}
      {% else %}
        {{
          trigger.event.data.entity_id in ns.entities
          and trigger.event.data.old_state is not none
          and trigger.event.data.new_state is not none
          and trigger.event.data.old_state.state != trigger.event.data.new_state.state
        }}
      {% endif %}

variables:
  monitor_rules: !input monitors

action:
  - repeat:
      for_each: "{{ monitor_rules }}"
      sequence:
        - variables:
            monitor_enabled_value: "{{ repeat.item.get('enabled', true) | bool(true) }}"
            monitor_name_value: "{{ repeat.item.get('name', 'Sledovač') }}"
            monitor_entity_value: "{{ repeat.item.get('entity', '') }}"
            monitor_state_value: "{{ repeat.item.get('target_state', 'on') | string }}"
            monitor_alert_after_value: "{{ repeat.item.get('alert_after', {}) or {} }}"
            monitor_repeat_interval_value: "{{ repeat.item.get('repeat_interval', {}) or {} }}"
            monitor_alert_duration_value: "{{ repeat.item.get('alert_duration', {}) or {} }}"
            monitor_players_value: "{{ repeat.item.get('media_players', []) or [] }}"
            monitor_entry_sound_enabled_value: "{{ repeat.item.get('entry_sound_enabled', true) | bool(true) }}"
            monitor_entry_sound_value: "{{ repeat.item.get('entry_sound', {}) or {} }}"
            monitor_recovery_sound_enabled_value: "{{ repeat.item.get('recovery_sound_enabled', true) | bool(true) }}"
            monitor_recovery_sound_value: "{{ repeat.item.get('recovery_sound', {}) or {} }}"
            monitor_alert_sound_enabled_value: "{{ repeat.item.get('alert_sound_enabled', true) | bool(true) }}"
            monitor_alert_sound_value: "{{ repeat.item.get('alert_sound', {}) or {} }}"
            monitor_sound_volume_value: "{{ repeat.item.get('sound_volume', 0.7) | float(0.7) }}"
            monitor_aas_start_value: "{{ repeat.item.get('aas_start_event', 'none') }}"
            monitor_aas_cleared_value: "{{ repeat.item.get('aas_cleared_event', 'none') }}"
            monitor_aas_timeout_value: "{{ repeat.item.get('aas_timeout_event', 'none') }}"
            monitor_alert_after_seconds: >-
              {{
                (monitor_alert_after_value.get('hours', 0) | int(0)) * 3600
                + (monitor_alert_after_value.get('minutes', 0) | int(0)) * 60
                + (monitor_alert_after_value.get('seconds', 0) | int(0))
              }}
            monitor_repeat_interval_seconds: >-
              {{
                [
                  (monitor_repeat_interval_value.get('hours', 0) | int(0)) * 3600
                  + (monitor_repeat_interval_value.get('minutes', 0) | int(0)) * 60
                  + (monitor_repeat_interval_value.get('seconds', 0) | int(0)),
                  1
                ] | max
              }}
            monitor_alert_duration_seconds: >-
              {{
                [
                  (monitor_alert_duration_value.get('hours', 0) | int(0)) * 3600
                  + (monitor_alert_duration_value.get('minutes', 0) | int(0)) * 60
                  + (monitor_alert_duration_value.get('seconds', 0) | int(0)),
                  1
                ] | max
              }}

        - if:
            - condition: template
              value_template: "{{ monitor_enabled_value and monitor_entity_value != '' }}"
            - condition: template
              value_template: >-
                {{
                  (trigger.id == 'entity_state_changed'
                    and trigger.event.data.entity_id == monitor_entity_value
                    and trigger.event.data.old_state is not none
                    and trigger.event.data.new_state is not none
                    and trigger.event.data.old_state.state != trigger.event.data.new_state.state)
                  or
                  (trigger.id == 'homeassistant_start'
                    and is_state(monitor_entity_value, monitor_state_value))
                }}
          then:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ is_state(monitor_entity_value, monitor_state_value) }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ monitor_entry_sound_enabled_value and monitor_entry_sound_value is mapping and monitor_entry_sound_value.media_content_id is defined and (monitor_players_value | count > 0) }}"
                      then:
                        - continue_on_error: true
                          action: media_player.play_media
                          target:
                            entity_id: "{{ monitor_players_value }}"
                          data:
                            media_content_id: "{{ monitor_entry_sound_value.media_content_id }}"
                            media_content_type: "{{ monitor_entry_sound_value.media_content_type }}"
                    - if:
                        - condition: template
                          value_template: "{{ monitor_alert_after_seconds | int(0) > 0 }}"
                      then:
                        - wait_template: "{{ not is_state(monitor_entity_value, monitor_state_value) }}"
                          timeout:
                            seconds: "{{ monitor_alert_after_seconds | int(0) }}"
                          continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ is_state(monitor_entity_value, monitor_state_value) }}"
                      then:
                        - variables:
                            monitor_alert_started_ts: "{{ as_timestamp(now()) | float(0) }}"
                            monitor_original_volumes: >-
                              {% set ns = namespace(items=[]) %}
                              {% for player in monitor_players_value %}
                                {% set ns.items = ns.items + [dict(entity_id=player, volume=state_attr(player, 'volume_level') | float(0.5))] %}
                              {% endfor %}
                              {{ ns.items }}
                        - if:
                            - condition: template
                              value_template: "{{ monitor_aas_start_value != 'none' }}"
                          then:
                            - continue_on_error: true
                              action: mqtt.publish
                              data:
                                topic: aas/udalost
                                payload: "{{ monitor_aas_start_value }}"
                                qos: 1
                                retain: false
                        - sequence: !input alert_started_actions
                        - repeat:
                            while:
                              - condition: template
                                value_template: >-
                                  {{
                                    is_state(monitor_entity_value, monitor_state_value)
                                    and (as_timestamp(now()) - (monitor_alert_started_ts | float(0))) < (monitor_alert_duration_seconds | int(1))
                                  }}
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ monitor_alert_sound_enabled_value and monitor_alert_sound_value is mapping and monitor_alert_sound_value.media_content_id is defined and (monitor_players_value | count > 0) }}"
                                then:
                                  - continue_on_error: true
                                    action: media_player.volume_set
                                    target:
                                      entity_id: "{{ monitor_players_value }}"
                                    data:
                                      volume_level: "{{ monitor_sound_volume_value }}"
                                  - continue_on_error: true
                                    action: media_player.play_media
                                    target:
                                      entity_id: "{{ monitor_players_value }}"
                                    data:
                                      media_content_id: "{{ monitor_alert_sound_value.media_content_id }}"
                                      media_content_type: "{{ monitor_alert_sound_value.media_content_type }}"
                              - wait_template: "{{ not is_state(monitor_entity_value, monitor_state_value) }}"
                                timeout:
                                  seconds: >-
                                    {{
                                      [
                                        monitor_repeat_interval_seconds | int(1),
                                        (monitor_alert_duration_seconds | int(1))
                                        - (as_timestamp(now()) - (monitor_alert_started_ts | float(0))) | int(0)
                                      ] | min
                                    }}
                                continue_on_timeout: true
                        - repeat:
                            for_each: "{{ monitor_original_volumes }}"
                            sequence:
                              - continue_on_error: true
                                action: media_player.volume_set
                                target:
                                  entity_id: "{{ repeat.item.entity_id }}"
                                data:
                                  volume_level: "{{ repeat.item.volume }}"
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ is_state(monitor_entity_value, monitor_state_value) }}"
                              sequence:
                                - if:
                                    - condition: template
                                      value_template: "{{ monitor_aas_timeout_value != 'none' }}"
                                  then:
                                    - continue_on_error: true
                                      action: mqtt.publish
                                      data:
                                        topic: aas/udalost
                                        payload: "{{ monitor_aas_timeout_value }}"
                                        qos: 1
                                        retain: false
                                - sequence: !input alert_timeout_actions
                            - conditions:
                                - condition: template
                                  value_template: "{{ not is_state(monitor_entity_value, monitor_state_value) }}"
                              sequence:
                                - if:
                                    - condition: template
                                      value_template: "{{ monitor_aas_cleared_value != 'none' }}"
                                  then:
                                    - continue_on_error: true
                                      action: mqtt.publish
                                      data:
                                        topic: aas/udalost
                                        payload: "{{ monitor_aas_cleared_value }}"
                                        qos: 1
                                        retain: false
                                - sequence: !input state_cleared_actions
                - conditions:
                    - condition: template
                      value_template: >-
                        {{
                          trigger.id == 'entity_state_changed'
                          and trigger.event.data.entity_id == monitor_entity_value
                          and trigger.event.data.old_state is not none
                          and trigger.event.data.new_state is not none
                          and trigger.event.data.old_state.state == monitor_state_value
                          and trigger.event.data.new_state.state != monitor_state_value
                        }}
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ monitor_recovery_sound_enabled_value and monitor_recovery_sound_value is mapping and monitor_recovery_sound_value.media_content_id is defined and (monitor_players_value | count > 0) }}"
                      then:
                        - continue_on_error: true
                          action: media_player.play_media
                          target:
                            entity_id: "{{ monitor_players_value }}"
                          data:
                            media_content_id: "{{ monitor_recovery_sound_value.media_content_id }}"
                            media_content_type: "{{ monitor_recovery_sound_value.media_content_type }}"

mode: parallel
max: 100
max_exceeded: silent
