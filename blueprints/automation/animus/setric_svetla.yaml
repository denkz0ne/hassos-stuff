blueprint:
  name: "Šetrič Svetiel"
  description: |
    **Verzia 1.1.1**

    Jedna automatizácia pre viac miestností. Každá miestnosť si stráži vlastnú
    prítomnosť, čas nečinnosti a zariadenia, ktoré má po odchode vypnúť.

    `on` = prítomnosť, `off` = neprítomnosť.
    `unknown` a `unavailable` sa nepovažujú za neprítomnosť.

    Voliteľné ranné zhasnutie jednorazovo vypne cieľové entity po východe slnka
    a nastavenom posune. Nezakazuje ich neskôr znovu zapnúť.

    Kontrola prebieha každých 30 sekúnd a po štarte Home Assistanta.
    Blueprint nepotrebuje timer helpery.
  domain: automation
  author: denkz0ne
  homeassistant:
    min_version: 2026.9.0

  input:
    rooms_section:
      name: Miestnosti a pravidlá
      icon: mdi:lightbulb-auto
      description: |
        Každý blok funguje samostatne. Zapni ho, vyber senzory, nastav čas
        neprítomnosti a urč, čo má Šetrič Svetiel vypnúť.
      input:
        rooms:
          name: Miestnosti
          description: Pridaj toľko miestností, koľko potrebuješ. Každá si stráži vlastný neporiadok. 🙂
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              fields:
                enabled:
                  label: Aktívne pravidlo
                  required: true
                  selector:
                    boolean: {}

                name:
                  label: Názov miestnosti
                  required: true
                  selector:
                    text: {}

                presence_entities:
                  label: Senzory prítomnosti
                  required: true
                  selector:
                    entity:
                      multiple: true
                      reorder: true
                      filter:
                        - domain: binary_sensor
                          device_class:
                            - motion
                            - occupancy
                            - presence
                        - domain: input_boolean

                absence_timeout:
                  label: Zhasnúť po neprítomnosti
                  required: true
                  selector:
                    duration:
                      enable_day: false
                      enable_second: true
                      enable_millisecond: false

                turn_off_entities:
                  label: Vypnúť tieto entity
                  required: true
                  selector:
                    entity:
                      multiple: true
                      reorder: true
                      filter:
                        - domain: light
                        - domain: switch
                        - domain: group
                        - domain: fan
                        - domain: media_player
                        - domain: humidifier
                        - domain: input_boolean

                custom_actions:
                  label: Vlastná akcia po neprítomnosti
                  selector:
                    action: {}

                sunrise_enabled:
                  label: Ranné zhasnutie
                  selector:
                    boolean: {}

                sunrise_offset:
                  label: Po východe počkať
                  selector:
                    duration:
                      enable_day: false
                      enable_second: true
                      enable_millisecond: false

variables:
  room_rules: !input rooms

  current_ts: "{{ as_timestamp(now()) | float(0) }}"

  sunrise_reference_ts: >-
    {% if is_state('sun.sun', 'above_horizon') %}
      {% set changed = as_timestamp(states.sun.sun.last_changed, 0) | float(0) %}
      {% set next_rising = as_timestamp(state_attr('sun.sun', 'next_rising'), 0) | float(0) %}
      {% set estimated_today = next_rising - 86400 if next_rising > 0 else 0 %}
      {% if changed > 0 and estimated_today > 0 and ((changed - estimated_today) | abs) <= 600 %}
        {{ changed }}
      {% else %}
        0
      {% endif %}
    {% else %}
      0
    {% endif %}

triggers:
  - trigger: time_pattern
    seconds: "/30"
    id: periodic_check

  - trigger: homeassistant
    event: start
    id: homeassistant_start

conditions: []

actions:
  - alias: Skontroluj miestnosti
    repeat:
      for_each: "{{ room_rules }}"
      sequence:
        - variables:
            room_enabled: "{{ repeat.item.get('enabled', true) | bool(true) }}"
            room_name: "{{ repeat.item.get('name', 'Miestnosť') }}"
            room_presence_entities: "{{ repeat.item.get('presence_entities', []) or [] }}"
            room_absence_timeout: "{{ repeat.item.get('absence_timeout', {}) or {} }}"
            room_turn_off_entities: "{{ repeat.item.get('turn_off_entities', []) or [] }}"
            room_custom_actions: "{{ repeat.item.get('custom_actions', []) or [] }}"
            room_sunrise_enabled: "{{ repeat.item.get('sunrise_enabled', false) | bool(false) }}"
            room_sunrise_offset: "{{ repeat.item.get('sunrise_offset', {}) or {} }}"

        - if:
            - condition: template
              value_template: "{{ room_enabled }}"
          then:
            - variables:
                room_timeout_seconds: >-
                  {{
                    (room_absence_timeout.get('hours', 0) | int(0)) * 3600
                    + (room_absence_timeout.get('minutes', 0) | int(0)) * 60
                    + (room_absence_timeout.get('seconds', 0) | int(0))
                  }}

                room_sunrise_offset_seconds: >-
                  {{
                    (room_sunrise_offset.get('hours', 0) | int(0)) * 3600
                    + (room_sunrise_offset.get('minutes', 0) | int(0)) * 60
                    + (room_sunrise_offset.get('seconds', 0) | int(0))
                  }}

                room_is_absent: >-
                  {% set ns = namespace(absent=(room_presence_entities | count > 0)) %}
                  {% for entity_id in room_presence_entities %}
                    {% if not is_state(entity_id, 'off') %}
                      {% set ns.absent = false %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.absent }}

                room_entities_to_turn_off: >-
                  {% set ns = namespace(items=[]) %}
                  {% for entity_id in room_turn_off_entities %}
                    {% set current = states(entity_id) %}
                    {% if current not in ['off', 'unknown', 'unavailable'] %}
                      {% set ns.items = ns.items + [entity_id] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.items }}

            - variables:
                room_absence_started_ts: >-
                  {% set ns = namespace(latest=0) %}
                  {% if room_is_absent | bool(false) %}
                    {% for entity_id in room_presence_entities %}
                      {% set parts = entity_id.split('.', 1) %}
                      {% if parts | count == 2 %}
                        {% set entity = states[parts[0]][parts[1]] %}
                        {% set changed = as_timestamp(entity.last_changed, 0) | float(0) %}
                        {% if changed > ns.latest %}
                          {% set ns.latest = changed %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                  {{ ns.latest }}

                room_sunrise_target_ts: >-
                  {% if room_sunrise_enabled | bool(false) and sunrise_reference_ts | float(0) > 0 %}
                    {{ (sunrise_reference_ts | float(0)) + (room_sunrise_offset_seconds | float(0)) }}
                  {% else %}
                    0
                  {% endif %}

            - variables:
                room_absence_elapsed: >-
                  {% if (room_is_absent | bool(false)) and (room_absence_started_ts | float(0) > 0) %}
                    {{ [0, current_ts | float(0) - (room_absence_started_ts | float(0))] | max }}
                  {% else %}
                    0
                  {% endif %}

                room_absence_due: >-
                  {{
                    (room_is_absent | bool(false))
                    and (room_absence_started_ts | float(0) > 0)
                    and ((room_absence_elapsed | float(0)) >= (room_timeout_seconds | float(0)))
                    and (room_entities_to_turn_off | count > 0)
                  }}

                room_sunrise_due: >-
                  {{
                    (room_sunrise_enabled | bool(false))
                    and (room_sunrise_target_ts | float(0) > 0)
                    and (current_ts | float(0) >= room_sunrise_target_ts | float(0))
                    and (current_ts | float(0) < (room_sunrise_target_ts | float(0) + 31))
                    and (room_entities_to_turn_off | count > 0)
                  }}

            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ room_absence_due }}"
                  sequence:
                    - alias: Po neprítomnosti vypni
                      continue_on_error: true
                      action: homeassistant.turn_off
                      target:
                        entity_id: "{{ room_entities_to_turn_off }}"

                    - alias: Spusti vlastné akcie po neprítomnosti
                      repeat:
                        for_each: "{{ room_custom_actions }}"
                        sequence:
                          - variables:
                              custom_step: "{{ repeat.item }}"

                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ custom_step.action is defined }}"
                                sequence:
                                  - choose:
                                      - conditions:
                                          - condition: template
                                            value_template: >-
                                              {{
                                                custom_step.target is defined
                                                and custom_step.data is defined
                                              }}
                                        sequence:
                                          - continue_on_error: true
                                            action: "{{ custom_step.action }}"
                                            target: "{{ custom_step.target }}"
                                            data: "{{ custom_step.data }}"

                                      - conditions:
                                          - condition: template
                                            value_template: "{{ custom_step.target is defined }}"
                                        sequence:
                                          - continue_on_error: true
                                            action: "{{ custom_step.action }}"
                                            target: "{{ custom_step.target }}"

                                      - conditions:
                                          - condition: template
                                            value_template: "{{ custom_step.data is defined }}"
                                        sequence:
                                          - continue_on_error: true
                                            action: "{{ custom_step.action }}"
                                            data: "{{ custom_step.data }}"

                                    default:
                                      - continue_on_error: true
                                        action: "{{ custom_step.action }}"

                              - conditions:
                                  - condition: template
                                    value_template: "{{ custom_step.delay is defined }}"
                                sequence:
                                  - delay: "{{ custom_step.delay }}"

                              - conditions:
                                  - condition: template
                                    value_template: "{{ custom_step.scene is defined }}"
                                sequence:
                                  - continue_on_error: true
                                    action: scene.turn_on
                                    target:
                                      entity_id: "{{ custom_step.scene }}"

                - conditions:
                    - condition: template
                      value_template: "{{ room_sunrise_due }}"
                  sequence:
                    - alias: Ráno zhasni
                      continue_on_error: true
                      action: homeassistant.turn_off
                      target:
                        entity_id: "{{ room_entities_to_turn_off }}"

mode: parallel
max: 10
max_exceeded: silent
